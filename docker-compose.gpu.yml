# GPU override — use: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=GPU-08b18de7-af3b-aa16-9b88-d214ab78711c
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - GPU_ACCELERATION_ENABLED=true
      # ClipAI v4 universal reframing: enable all editorial signals by default.
      - CLIPAI_ANIME_ANCHOR=1
      - CLIPAI_MUSIC_BEAT_SNAP=1
      - CLIPAI_GAMEPLAY_TRACKER=1
      - CLIPAI_EDITORIAL_PRIOR=1
      - CLIPAI_THIRDS_BIAS=1
      - CLIPAI_GAZE_LEAD_ROOM_V2=1
      # --- Auth tuning ---
      # - CLIPAI_BIND_SESSION_TO_IP=true   # enable IP binding (off by default)
      # - CLIPAI_HTTPS=true                # set Secure cookie flag for HTTPS
      # - CLIPAI_API_KEY=<your-key>        # /api/v1/ machine-to-machine key
    devices:
      # Intel/AMD VA-API support (passthrough DRI devices)
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['GPU-08b18de7-af3b-aa16-9b88-d214ab78711c']
              capabilities: [gpu, video, compute]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['GPU-08b18de7-af3b-aa16-9b88-d214ab78711c']
              capabilities: [gpu, compute]
