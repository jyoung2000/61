name: CI

# Validate every push and PR: the frontend builds + its unit tests pass, and the
# offline backend unit tests pass. Heavy ML work (real Whisper/NMT models, GPU,
# media, network) is intentionally out of scope here — those paths are exercised
# by the Docker images, not unit CI.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests (vitest)
        run: npm test

  backend:
    name: Backend — offline unit tests
    runs-on: ubuntu-latest
    env:
      # Match the container runtime: pure-Python protobuf keeps protobuf/mediapipe
      # compatible, and tests never reach the network for models.
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries (OpenCV / ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU torch wheel FIRST so `-r requirements.txt` treats
          # torch==2.5.1 as already satisfied and does NOT pull the multi-GB CUDA
          # (nvidia-*-cu12) wheel stack from PyPI (mirrors the CPU Dockerfile).
          pip install --retries 5 --timeout 120 torch==2.5.1 torchaudio==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install --retries 5 --timeout 120 -r backend/requirements.txt
          pip install pytest
      - name: Run offline unit tests
        run: |
          pytest -v \
            tests/test_transcription_translation_redesign.py \
            tests/test_translate_step_reliability.py \
            tests/test_whisper_native_translate.py \
            tests/test_clip_detection_graceful.py \
            tests/test_phantom_hallucination_filter.py \
            tests/test_audio_precondition_chain.py \
            tests/test_job_events_persistence.py \
            tests/test_browser_preview_nonblocking.py \
            tests/test_clip_seo_sidecar.py \
            tests/test_subtitle_extend_before_split.py \
            backend/tests/test_repetition_and_timeline.py \
            backend/tests/test_translation_fail_loud.py \
            backend/tests/test_engine_checkpoint.py
