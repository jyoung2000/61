[package]
name = "clipai-companion"
version = "0.1.0"
description = "ClipAI GPU Companion — share a desktop GPU (Ollama + Whisper) with a ClipAI server over the LAN"
authors = ["ClipAI"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "clipai_companion_lib"
# Desktop-only: rlib. (staticlib/cdylib are only needed for Tauri
# mobile targets — and cdylib exports every symbol, which overflows the
# Windows PE 65535-ordinal export limit under the MinGW cross-build.)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
socket2 = "0.5"
rand = "0.8"
dirs = "5"
hostname = "0.4"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }

# Windows Job Object API — used to tie the managed Ollama/whisper children to
# the Companion's lifetime so they die when it exits (even on Task-Manager kill).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is a URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# NOTE: `panic = "abort"` is intentionally NOT set. With abort, a panic in
# any spawned task (GPU poll, proxy, ollama) instantly kills the whole
# console-less GUI — which looks like "opens then closes". Unwinding keeps
# the window alive; the panic hook in lib.rs logs the failure to a file.
codegen-units = 1
lto = true
opt-level = "s"
# Keep line tables (not full debug) so the crash log's backtraces carry
# file:line — worth the modest size increase for a diagnosable installer.
strip = false
debug = "line-tables-only"
