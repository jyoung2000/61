[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inflect-studio"
version = "0.1.0"
description = "Local voice cloning + inflection-aware TTS studio (IndexTTS-2 / Chatterbox / Fish)"
requires-python = ">=3.10,<3.12"
readme = "README.md"

[tool.setuptools]
packages = ["inflect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
